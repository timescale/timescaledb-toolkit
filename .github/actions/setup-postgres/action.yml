name: Set up PostgreSQL and pgrx
description: Install a pinned PostgreSQL release and register it with cargo-pgrx
inputs:
  version:
    description: Full PostgreSQL release number
    required: true

runs:
  using: composite
  steps:
    - name: Set up Rust and build paths
      shell: bash
      env:
        PG_RELEASE: ${{ inputs.version }}
      run: |
        source tools/dependencies.sh
        cargo_home=${CARGO_HOME:-$HOME/.cargo}
        if ! command -v rustup >/dev/null; then
          curl -fsSL --retry 3 https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$cargo_home/bin:$PATH"
        fi
        rustup toolchain install "$RUST_TOOLCHAIN" --profile "$RUST_PROFILE" --component "$RUST_COMPONENTS"
        {
          echo "PG_MAJOR=${PG_RELEASE%%.*}"
          echo "PG_PREFIX=$HOME/.local/postgresql/$PG_RELEASE"
          echo "PGRX_HOME=$RUNNER_TEMP/pgrx"
          echo "PGRX_VERSION=$PGRX_VERSION"
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN"
          echo "CARGO_HOME=$cargo_home"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/postgresql/$PG_RELEASE/bin" >> "$GITHUB_PATH"

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bison build-essential clang cmake flex libclang-dev libicu-dev libreadline-dev libssl-dev pkg-config zlib1g-dev

    - uses: actions/cache/restore@v4
      id: postgres
      with:
        path: ${{ env.PG_PREFIX }}
        key: postgres-ubuntu24-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles('.github/scripts/build-postgres.sh') }}
    - name: Build PostgreSQL
      if: steps.postgres.outputs.cache-hit != 'true'
      shell: bash
      env:
        PG_RELEASE: ${{ inputs.version }}
      run: bash .github/scripts/build-postgres.sh
    - uses: actions/cache/save@v4
      if: steps.postgres.outputs.cache-hit != 'true'
      with:
        path: ${{ env.PG_PREFIX }}
        key: ${{ steps.postgres.outputs.cache-primary-key }}

    - uses: actions/cache@v4
      id: pgrx
      with:
        path: ${{ env.CARGO_HOME }}/bin/cargo-pgrx
        key: cargo-pgrx-ubuntu24-${{ runner.arch }}-${{ env.PGRX_VERSION }}-${{ env.RUSTUP_TOOLCHAIN }}
    - name: Install cargo-pgrx
      if: steps.pgrx.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --version "=$PGRX_VERSION" cargo-pgrx
    - name: Register PostgreSQL
      shell: bash
      run: cargo pgrx init "--pg$PG_MAJOR" "$PG_PREFIX/bin/pg_config"
