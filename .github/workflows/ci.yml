name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    outputs:
      postgres: ${{ steps.versions.outputs.postgres }}
    steps:
      - uses: actions/checkout@v5
      - id: versions
        run: |
          source tools/dependencies.sh
          echo "postgres=$(jq -cn --arg versions "$PG_RELEASES" '$versions | split(" ")')" >> "$GITHUB_OUTPUT"

  test:
    name: PostgreSQL ${{ matrix.postgres }}
    needs: versions
    runs-on: runs-on/fleet=linux-8cpu-x64-ubuntu24/env=ue1
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.versions.outputs.postgres) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-postgres
        with:
          version: ${{ matrix.postgres }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --no-default-features --features "pg$PG_MAJOR,pg_test" -- -D warnings
      - run: cargo test --locked --workspace --no-default-features --features "pg$PG_MAJOR,pg_test"
